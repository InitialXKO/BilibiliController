name: Build and Attach CRX to Release

on:
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Extension Package
        run: |
          npx crx keygen .
          npx crx pack chrome_extension -p key.pem -o bilibili-remote-control.crx --zip-output bilibili-remote-control.zip

      - name: Upload CRX & ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bilibili-remote-control.crx
            bilibili-remote-control.zip
