name: Build and Attach CRX to Release

on:
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin shell URL to this release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          sed -i "s|@main/remote/public/index.html|@${TAG}/remote/public/index.html|" chrome_extension/config.js
          grep -q "@${TAG}/remote/public/index.html" chrome_extension/config.js \
            || { echo "::error::替换失败：config.js 中找不到 @main 锚点"; exit 1; }
          for i in 1 2 3; do
            curl -fsSL -o /dev/null \
              "https://cdn.jsdelivr.net/gh/InitialXKO/BilibiliController@${TAG}/remote/public/index.html" \
              && exit 0
            sleep 20
          done
          echo "::error::jsDelivr 取不到 ${TAG} 的壳页"; exit 1

      - name: Build Extension Package
        run: |
          openssl genrsa -out key.pem 2048
          npx crx3 -p key.pem -o bilibili-remote-control.crx chrome_extension/manifest.json chrome_extension/*
          zip -r bilibili-remote-control.zip chrome_extension

      - name: Upload CRX & ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bilibili-remote-control.crx
            bilibili-remote-control.zip
