<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Bilibili Remote Loader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }

    #loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #00a1d6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: #e0e0e0;
    }

    .error-text {
      color: #ff5252;
      font-size: 0.95rem;
      max-width: 320px;
      margin-top: 10px;
      word-break: break-all;
    }

    .retry-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #00a1d6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
  </style>
</head>
<body>
  <div id="loader-container">
    <div class="spinner" id="spinner"></div>
    <div class="status-text" id="status-text">正在连接扩展端...</div>
    <div class="error-text" id="error-text" style="display: none;"></div>
    <button class="retry-btn" id="retry-btn" style="display: none;" onclick="location.reload()">重新连接</button>
  </div>

  <iframe id="app-frame" sandbox="allow-scripts allow-same-origin"></iframe>

  <script type="module" src="mobile.js"></script>
</body>
</html>
